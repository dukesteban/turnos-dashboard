<nav class="navbar" *ngIf="isLoggedIn">
  <div class="navbar-brand">
    <img src="assets/icon.png" alt="logo" class="navbar-logo" />
    <span class="navbar-nombre">{{ nombreNegocio }}</span>
  </div>
  <div class="navbar-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <span class="icono">📋</span><span class="texto"> Turnos</span>
    </a>
    <a routerLink="/agenda" routerLinkActive="active">
      <span class="icono">📅</span><span class="texto"> Agenda</span>
    </a>
    <!--
      LOS LINKS DEPENDEN DEL ROL. `*ngIf` y no CSS: un link escondido con
      `display: none` sigue en el DOM, se llega con el teclado y aparece en el
      historial de la pagina.

      Caja y Personas son de admin y secretario. Configuracion es solo del admin:
      ahi van los horarios de atencion, los precios y las contrasenas.

      Esto NO es seguridad por sí solo: la seguridad real la hacen las políticas de RLS
      de la base (migración 016), que miran el rol que trae el JWT de Supabase Auth. El
      `*ngIf` y la guard son solo para ordenar la pantalla.
    -->
    <a *ngIf="puedeVerCaja" routerLink="/ganancias" routerLinkActive="active">
      <span class="icono">💰</span><span class="texto"> Caja</span>
    </a>
    <!--
      PERSONAS agrupa las tres fichas de gente: clientes, empleados y
      proveedores. `routerLinkActive` sin `exact` para que `/personas` quede
      marcado también en las tres pestañas: si no, solo se resalta en Clientes y
      uno no ve dónde está parado.
    -->
    <a *ngIf="puedeVerPersonas" routerLink="/personas" routerLinkActive="active">
      <span class="icono">👥</span><span class="texto"> Personas</span>
    </a>
    <a *ngIf="puedeVerConfig" routerLink="/configuracion" routerLinkActive="active">
      <span class="icono">⚙️</span><span class="texto"> Config</span>
    </a>
    <!--
      CAMBIAR LA CONTRASEÑA PROPIA, para los tres roles.

      Estaba en Configuración, que ahora es solo del admin: el secretario se quedaba
      sin forma de cambiar su propia contraseña. Va acá, en el candado al lado de la
      puerta, que es donde uno la busca.

      Es distinto del 🔑 de la pantalla de Usuarios: ese es el admin definiendo la
      contraseña de OTRO (que no conoce la actual). Este verifica la actual, así que
      no sirve para cambiarle la clave a nadie.

      El candado cerrado y no la llave: la llave ya es el ícono del reset que hace el
      admin en la pantalla de Usuarios. Con los dos iguales, quien administera
      Usuarios y quien use esto no distinguen un botón del otro.
    -->
    <button class="btn-logout" (click)="abrirCambioPassword()" title="Cambiar mi contraseña">🔐</button>
    <button class="btn-logout" (click)="logout()" title="Cerrar sesión">🚪</button>
  </div>
</nav>

<!-- ═══ CAMBIAR MI CONTRASEÑA ═══ -->
<div *ngIf="mostrarCambioPassword" class="popup-overlay" (click)="cerrarCambioPassword()">
  <div class="popup" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h3>🔑 Cambiar mi contraseña</h3>
      <button class="btn-cerrar" (click)="cerrarCambioPassword()">✕</button>
    </div>
    <div class="popup-body">
      <div *ngIf="mensajePassword" class="alerta exito">{{ mensajePassword }}</div>
      <div *ngIf="mensajeErrorPassword" class="error-msg">{{ mensajeErrorPassword }}</div>

      <div class="cambios-restantes" *ngIf="cambiosHoy > 0">
        ⚠️ Cambios realizados hoy: {{ cambiosHoy }}/2
      </div>

      <div class="form-caja">
        <div class="campo">
          <label>Contraseña actual</label>
          <input type="password" [(ngModel)]="passwordActual" placeholder="••••••••"
                 autocomplete="current-password" (ngModelChange)="mensajeErrorPassword = ''" />
        </div>
        <div class="campo">
          <label>Nueva contraseña</label>
          <input type="password" [(ngModel)]="passwordNueva" placeholder="Mínimo 6 caracteres"
                 autocomplete="new-password" (ngModelChange)="mensajeErrorPassword = ''" />
        </div>
        <div class="campo">
          <label>Repetir la nueva</label>
          <input type="password" [(ngModel)]="passwordRepetir" placeholder="Para confirmar"
                 autocomplete="new-password" (ngModelChange)="mensajeErrorPassword = ''" />
        </div>
      </div>
    </div>
    <div class="popup-acciones">
      <!--
        `mensajePassword` en el `[disabled]`: mientras siga el aviso verde, guardar
        otra vez no tiene sentido (los campos ya están vacíos, y `cambiarPassword`
        cortaría con "completá los tres campos"). Sin esto el botón parece roto.
      -->
      <button class="btn-atendido" (click)="cambiarPassword()"
              [disabled]="guardandoPassword || cambiosHoy >= 2 || !!mensajePassword">
        {{ guardandoPassword ? 'Guardando...' : (mensajePassword ? '✓ Listo' : '💾 Guardar') }}
      </button>
      <button class="btn-cancelado" (click)="cerrarCambioPassword()">↩️ Cerrar</button>
    </div>
  </div>
</div>

<main class="main-content">
  <router-outlet />
</main>

<!--
  AVISO DE VERSIÓN NUEVA

  Aparece SOLO cuando el service worker ya descargó una versión nueva y la está
  esperando. Sirve para que no haya que adivinar que hay que cerrar la app del
  todo para que se actualice.

  Va antes del `<footer>` y NO dentro de `<main>`: tiene que estar sobre el
  contenido, no ocupar lugar en el flujo, porque el usuario va a seguir usando
  la pantalla de abajo mientras lo decide.
-->
<div class="aviso-actualizacion" *ngIf="hayVersionNueva" role="status" aria-live="polite">
  <span class="aviso-texto">Hay una versión nueva disponible</span>
  <button class="btn-actualizar" (click)="actualizarAhora()">Actualizar</button>
  <button class="btn-cerrar-aviso" (click)="despuesActualizar()" title="Ahora no"
          aria-label="Ahora no">✕</button>
</div>

<footer class="version-footer">v1.0.22</footer>

<style>
  /* OJO: los estilos globales (body, font-family, reset) van en src/styles.scss.
     Acá NO funcionan: Angular le agrega [_ngcontent-xxx] a estos selectores, así
     que `body` y `*` nunca matchean nada. */

  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .navbar-logo {
    width: 28px;
    height: 28px;
    object-fit: contain;
  }

  .navbar-nombre {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    background: #1e293b;
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .navbar-brand {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .navbar-links {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .navbar-links a {
    color: #94a3b8;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .navbar-links a:hover { color: white; background: #334155; }
  .navbar-links a.active { color: white; background: #3b82f6; }

  .btn-logout {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 1.1rem;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    margin-left: 4px;
  }
  .btn-logout:hover { color: white; background: #334155; }

  /* `var(--chrome-app)` y no `56px`: hay que descontar del alto de la ventana todo
     lo que NO es contenido, no solo el navbar. Con `100vh - 56` el main crecia
     hasta el pie de la ventana y el `<footer>` de mas abajo quedaba SIEMPRE
     fuera: la pagina scrolleaba 40px en todas las pantallas. En Agenda eso
     terminaba en dos scrollbars (el de la grilla y el de la pagina) y no se
     sabia con cual se estaba scrolleando.

     El detalle de por qué la variable vale 96 y no 56 está en styles.scss, junto a
     la definición: es el navbar (56) más el footer (40). Antes sumaban 112, que
     incluía los 16px del margen del body que ya no existe. */
  .main-content { min-height: calc(100vh - var(--chrome-app)); }

  @media (max-width: 640px) {
    .navbar { padding: 0 12px; }
    .navbar-brand { font-size: 1rem; }
    .navbar-links a { padding: 8px; }
    .navbar-nombre { display: none; }
    .texto { display: none; }
  }
  
  .version-footer {
    text-align: center;
    font-size: 0.72rem;
    color: #cbd5e1;
    padding: 12px;
  }
</style>
