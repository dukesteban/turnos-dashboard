<!--
  PESTAÑAS DE PERSONAS

  Los botones son `routerLink` a rutas hijas, no un `(click)` que cambie un
  campo. Ver el doc de la clase: es lo que hace que /clientes y /empleados
  puedan redirigir acá, que "atrás" funcione y que la URL se pueda compartir.
-->
<div class="personas-page">

  <nav class="tabs tabs-personas">
    <a routerLink="/personas/clientes" [class.activo]="esClientes">
      👤 Clientes
    </a>
    <a routerLink="/personas/empleados" [class.activo]="esEmpleados">
      🧑‍🔧 Empleados
    </a>
    <a routerLink="/personas/proveedores" [class.activo]="esProveedores">
      📦 Proveedores
    </a>
  </nav>

  <!--
    `*ngIf` y no un `<router-outlet>`: cada pantalla carga en su `ngOnInit` y
    ninguna usa el Router.
    El `visitados[...]` es lo que evita que se recarguen al volver: una pestaña
    ya abierta queda montada y solo se oculta. Con `*ngIf="esClientes"` a secas,
    cambiar de pestaña la destruía y volver costaba otra carga completa.
  -->
  <div class="tab-panel" [hidden]="!esClientes">
    <app-clientes *ngIf="visitados['clientes'] || esClientes" />
  </div>

  <div class="tab-panel" [hidden]="!esEmpleados">
    <app-empleados *ngIf="visitados['empleados'] || esEmpleados" />
  </div>

  <div class="tab-panel" [hidden]="!esProveedores">
    <app-proveedores *ngIf="visitados['proveedores'] || esProveedores" />
  </div>
</div>
